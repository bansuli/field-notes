<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="preload" href="images/DSC_3332.jpg" as="image">

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    :root{
      --gs: 1;
      --ink:black;
      --muted: rgba(11,11,11,0.62);
      --faded: rgba(11,11,11,0.20);
      --hairline: rgba(11,11,11,0.14);
      --paper:white;
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --max: 1560px;
      --gutter: 34px;
    }

    /* overflow-x on <body> would make the body its own scroll container,
       which freezes window.scrollY and kills the hero colour fade.
       Keep the horizontal clip on <html> only. */
    html{ overflow-x:hidden; }
    html, body{ background:var(--paper); }
    body{
      font-family:var(--sans);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    /* ===== HERO ===== */
    header{
      padding: 20px 0 0;
      text-align: center;
    }
    .inner{ max-width:var(--max); margin:0 auto; padding:0 var(--gutter); }

    .hero-title{
      text-indent: -0.05em;
      font-weight:800;
      font-size:14vw;
      line-height:0.7;
      letter-spacing:-0.05em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    p{
      margin:22px auto 12px;
      max-width:760px;
      font-size:16px;
      line-height:1.35;
      opacity: 1;
      color: black;
    }

    .bleed{
      width:100vw;
      margin-left:calc(50% - 50vw);
    }
    .hero-image{
      width:100%;
      height:calc(100vh - 180px);
      background-image:url("images/DSC_3332.jpg");
      background-size:cover;
      background-position:center;
      filter: brightness(0.9) grayscale(var(--gs));
      will-change: filter;
    }

    /* ===== COUNTRY TYPE =====
       The type treatment from the old country list, kept for reuse.
       Family is inherited from body (Inter, var(--sans)). */
    .country-type{
      font-weight:300;
      font-size:clamp(26px, 2.8vw, 44px);
      letter-spacing:0.04em;
      text-transform:uppercase;
      color:var(--ink);
    }

    /* ===== COUNTRY PICKER =====
       min-height also gives the hero its scroll runway. */
    .canvas{
      min-height:100vh;
      padding:40px 0 90px;
    }

    /* dropdown, right hand side */
    .country-select-wrap{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }
    .country-select-label{
      font-size:11px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .country-select{
      -webkit-appearance:none;
      appearance:none;
      font-family:inherit;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--ink);
      background:transparent;
      border:0;
      border-bottom:1px solid var(--hairline);
      border-radius:0;
      padding:8px 26px 8px 2px;
      cursor:pointer;
      /* caret */
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='black' stroke-width='1.2'/></svg>");
      background-repeat:no-repeat;
      background-position:right 4px center;
      transition:border-color 300ms ease;
    }
    .country-select:hover,
    .country-select:focus-visible{ border-bottom-color:var(--ink); }

    /* centred list, names running straight after each other */
    .country-list{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:baseline;
      column-gap:0.4em;
      row-gap:0.1em;
      margin-top:70px;
    }
    .country-item{
      font-family:inherit;
      background:none;
      border:0;
      padding:0;
      cursor:pointer;
      color:var(--faded);
      transition:color 450ms ease;
    }
    .country-item.is-selected{ color:var(--ink); }
    .country-item:hover{ color:var(--muted); }
    .country-item.is-selected:hover{ color:var(--ink); }

    @media (prefers-reduced-motion: reduce){
      #app{ transition: none !important; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px){
      .hero-title{
        font-size: 14.5vw;
      }
      p{
        font-size: 10px;
        margin: 12px auto 10px;
      }
      .hero-image{ height: 56vh; }
      .canvas{ padding:28px 0 60px; }
      .country-list{ margin-top:44px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="inner">
        <h1 class="hero-title">FIELD NOTES</h1>
        <p>a curated archive of stays, eats, and experiences. ongoing...</p>
      </div>
      <div class="bleed">
        <div class="hero-image"></div>
      </div>
    </header>

    <section class="canvas">
      <div class="inner">

        <div class="country-select-wrap">
          <label class="country-select-label" for="countrySelect">Country</label>
          <select class="country-select" id="countrySelect">
            <option value="costa-rica">Costa Rica</option>
            <option value="puerto-rico">Puerto Rico</option>
          </select>
        </div>

        <div class="country-list" id="countryList">
          <button type="button" class="country-item country-type" data-country="costa-rica">Costa Rica</button>
          <button type="button" class="country-item country-type" data-country="puerto-rico">Puerto Rico</button>
        </div>

      </div>
    </section>

  </div><!-- end #app -->

  <script>
    if (history.scrollRestoration) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }

    const heroEl = document.querySelector('.hero-image');

    function updateHeroColor(){
      if (!heroEl) return;
      /* fade across most of the hero's own height so the colour arrives
         gradually as the image scrolls away, not in one wheel notch */
      const fadeDistance = Math.max(heroEl.offsetHeight * 0.75, 200);
      const progress = clamp(window.scrollY / fadeDistance, 0, 1);
      const gs = (1 - progress).toFixed(3);
      document.documentElement.style.setProperty('--gs', gs);
      /* set it on the element too: Safari does not always repaint a
         filter() that reads a custom property */
      heroEl.style.filter = 'brightness(0.9) grayscale(' + gs + ')';
    }

    updateHeroColor();
    window.addEventListener('scroll', () => requestAnimationFrame(updateHeroColor), { passive: true });
    window.addEventListener('resize', updateHeroColor);
    window.addEventListener('load', updateHeroColor);
  </script>

  <script>
    (() => {
      const select = document.getElementById('countrySelect');
      const items = [...document.querySelectorAll('.country-item')];

      function setCountry(value){
        select.value = value;
        items.forEach(el => el.classList.toggle('is-selected', el.dataset.country === value));
      }

      select.addEventListener('change', () => setCountry(select.value));
      items.forEach(el => el.addEventListener('click', () => setCountry(el.dataset.country)));

      setCountry(select.value);
    })();
  </script>

</body>
</html>
