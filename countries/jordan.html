<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordan — Field Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    /* The browser's own focus ring (a blue rounded box in Chrome) is never
       wanted on this site -- the UI draws its own indicators where it needs
       one, e.g. .country-tab:focus-visible below. */
    :focus{ outline:none; }
    :focus-visible{ outline:none; }
    ::-moz-focus-inner{ border:0; }
    :root{
      --paper:white;
      --ink:#0b0b0b;
      --hair: rgba(11,11,11,.18);
      --muted: rgba(11,11,11,.62);
      --max: 1560px;
      --gutter: 34px;
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    a{color:inherit;text-decoration:none}

    /* ===== PAGE SPLIT ===== */
    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:0 var(--gutter);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      min-height:100vh;
    }

    /* ===== LEFT NAV ===== */
    .left{
      padding: 56px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      align-self:start;

    }

    .big-nav{
      display:flex;
      flex-direction:column;
      gap: 18px;
      margin-top: 18px;
    }

    .big-link{
  font-size: clamp(32px, 4vw, 64px);   /* smaller */
  font-weight: 400;                    /* thinner */
  letter-spacing: -0.01em;
  text-transform: uppercase;
  line-height: 0.95;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--ink);  /* thicker + stronger line */
}


    /* optional: tiny "back" link like a studio site */
    .back{
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .back:hover{color:var(--ink)}

    /* ===== RIGHT FEED ===== */
    .right{
      padding: 56px 0 90px;
    }

    .entry{
      padding-top: 10px;
      border-top: 1px solid var(--hair);
      margin-bottom: 52px;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap: 16px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 0 14px;
      flex-wrap:wrap;
    }

    .img{
      width:100%;
      display:block;
      border:0;
    }

    /* ===== SECTION ANCHORS (so STAYS/EATS/DO’S can scroll) ===== */
    .section-title{
      font-size: 14px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 6px 0 18px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 980px){
      .wrap{ grid-template-columns:1fr; }
      .left{ position:relative; height:auto; padding:28px 0 0; }
      .right{ padding:18px 0 70px; }
      .big-link{ font-size: clamp(34px, 9vw, 68px); }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <!-- LEFT -->
    <aside class="left">
      <a class="back" href="../index.html">← back to field notes</a>

      <nav class="big-nav" aria-label="Jordan sections">
        <a class="big-link" href="#stays">STAYS</a>
        <a class="big-link" href="#eats">EATS</a>
        <a class="big-link" href="#dos">DO’S</a>
      </nav>
    </aside>

    <!-- RIGHT -->
    <main class="right">

      <!-- STAYS -->
      <div id="stays" class="section-title">STAYS</div>

      <article class="entry">
        <div class="meta">
          <span>AMMAN</span>
          <span>STAYS</span>
        </div>
        <img class="img" src="../images/jordan.JPG" alt="Jordan photo" />
      </article>

      <article class="entry">
        <div class="meta">
          <span>WADI RUM</span>
          <span>STAYS</span>
        </div>
        <img class="img" src="../images/DSC_3332.jpg" alt="Jordan photo" />
      </article>

      <!-- EATS -->
      <div id="eats" class="section-title">EATS</div>

      <article class="entry">
        <div class="meta">
          <span>AMMAN</span>
          <span>EATS</span>
        </div>
        <img class="img" src="../images/lebanon.jpg" alt="Placeholder—swap image" />
      </article>

      <!-- DO’S -->
      <div id="dos" class="section-title">DO’S</div>

      <article class="entry">
        <div class="meta">
          <span>PETRA</span>
          <span>DO’S</span>
        </div>
        <img class="img" src="../images/mexico.jpg" alt="Placeholder—swap image" />
      </article>

    </main>
  </div>

</body>
</html>
