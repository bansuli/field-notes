<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puerto Rico &mdash; Field Notes</title>
  <!-- Declared explicitly so the browser cannot fall back to whatever
       favicon it has cached for the localhost origin. -->
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="stack.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    /* The browser's own focus ring (a blue rounded box in Chrome) is never
       wanted on this site -- the UI draws its own indicators where it needs
       one, e.g. .country-tab:focus-visible below. */
    :focus{ outline:none; }
    :focus-visible{ outline:none; }
    ::-moz-focus-inner{ border:0; }

    /* same tokens as the home page */
    :root{
      --ink:black;
      --muted: rgba(11,11,11,0.62);
      --faded: rgba(11,11,11,0.20);
      --hairline: rgba(11,11,11,0.14);
      --paper:white;
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --max: 1560px;
      --gutter: 34px;
    }

    /* overflow-x on <body> would make the body its own scroll container.
       Keep the horizontal clip on <html> only. */
    html{
      overflow-x:hidden;
      scrollbar-width:none;        /* Firefox */
      -ms-overflow-style:none;     /* old Edge */
    }
    html::-webkit-scrollbar{ display:none; }   /* Safari / Chrome */
    html, body{ background:var(--paper); }
    body{
      font-family:var(--sans);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }
    a{ color:inherit; text-decoration:none; }

    .inner{ max-width:var(--max); margin:0 auto; padding:0 var(--gutter); }

    /* ===== HEAD =====
       Floats over the panels so the first one fills the viewport on load.
       difference blending keeps it legible on the white panel and on the
       black one without having to swap colours per panel. */
    .page-head{
      position:fixed;
      top:0; left:0; right:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px var(--gutter);
      color:#8c8c8c;
      mix-blend-mode:difference;
      pointer-events:none;
    }
    .page-head a{ pointer-events:auto; }

    /* arrow only -- same 34x21 icon box and 12px padding as the
       menu button on the home page */
    .back{
      display:inline-flex;
      align-items:center;
      color:inherit;
      padding:12px;
      transition:color 300ms ease;
    }
    .back svg{ display:block; width:34px; height:21px; }
    .back:hover{ color:#ffffff; }

    .page-label{
      user-select:none;
      -webkit-user-select:none;
      padding:12px;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }

    @media (max-width: 640px){
      .page-head{ padding:8px 12px; }
      .page-label{ font-size:10px; }
    }
  </style>
</head>

<body>
  <div id="app">

    <header class="page-head">
      <a class="back" href="../index.html#puerto-rico" aria-label="Back to Field Notes">
        <svg viewBox="0 0 34 21" aria-hidden="true">
          <path d="M34 10.5H3M12.5 2L3 10.5l9.5 8.5" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
      </a>
      <h1 class="page-label">Puerto Rico</h1>
    </header>

    <section class="stack" id="stack">
      <div class="stack-viewport">
        <article class="panel" style="--panel-bg:#D2C2A2; --panel-ink:var(--ink)">  <!-- Warm Sand  #D2C2A2 -->
          <a class="panel-label panel-link" href="puerto-rico-stays.html" data-section="stays">Stays</a>
        </article>
        <article class="panel" style="--panel-bg:#B96F65; --panel-ink:var(--ink)">  <!-- Dusty Rose  #B96F65 -->
          <div class="panel-label">Do&rsquo;s</div>
        </article>
        <article class="panel" style="--panel-bg:#6F7745; --panel-ink:var(--ink)">  <!-- Earthy Olive  #6F7745 -->
          <a class="panel-label panel-link" href="puerto-rico-eats.html" data-section="eats">Eats</a>
        </article>
        <article class="panel" style="--panel-bg:#9DBFC0; --panel-ink:var(--ink)">  <!-- Sea Glass  #9DBFC0 -->
          <div class="panel-label">Tips</div>
        </article>
      </div>
    </section>

  </div>

  <script src="stack.js"></script>
</body>
</html>
