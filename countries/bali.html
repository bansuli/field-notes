<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bali &mdash; Field Notes</title>
  <!-- Declared explicitly so the browser cannot fall back to whatever
       favicon it has cached for the localhost origin. -->
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }

    /* same tokens as the home page */
    :root{
      --ink:black;
      --muted: rgba(11,11,11,0.62);
      --paper:white;
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --gutter: 34px;
    }

    /* never draw the browser's default blue focus ring */
    :focus{ outline:none; }
    :focus-visible{ outline:none; }

    html{
      scrollbar-width:none;        /* Firefox */
      -ms-overflow-style:none;     /* old Edge */
    }
    html::-webkit-scrollbar{ display:none; }   /* Safari / Chrome */
    html, body{ background:var(--paper); height:100%; }
    body{
      font-family:var(--sans);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }
    a{ color:inherit; text-decoration:none; }

    /* ===== HEAD =====
       Same geometry as the finished country pages so the back arrow and the
       country label do not jump when you move between them. Plain colours
       here -- there are no panels to blend against on a blank page. */
    .page-head{
      position:fixed;
      top:0; left:0; right:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px var(--gutter);
      color:#8c8c8c;
    }

    /* arrow only -- same 34x21 icon box and 12px padding as the
       menu button on the home page */
    .back{
      display:inline-flex;
      align-items:center;
      color:inherit;
      padding:12px;
      transition:color 300ms ease;
    }
    .back svg{ display:block; width:34px; height:21px; }
    .back:hover{ color:var(--ink); }

    .page-label{
      user-select:none;
      -webkit-user-select:none;
      padding:12px;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }

    /* ===== BLANK SLATE =====
       One line, optically centred in the viewport. Nothing else on the page
       until this country is actually written up. */
    .soon{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 var(--gutter);
    }
    .soon span{
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--muted);
    }

    @media (max-width: 640px){
      .page-head{ padding:8px 12px; }
      .page-label{ font-size:10px; }
    }
  </style>
</head>

<body>
  <div id="app">

    <header class="page-head">
      <a class="back" href="../index.html#bali" aria-label="Back to Field Notes">
        <svg viewBox="0 0 34 21" aria-hidden="true">
          <path d="M34 10.5H3M12.5 2L3 10.5l9.5 8.5" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
      </a>
      <h1 class="page-label">Bali</h1>
    </header>

    <main class="soon">
      <span>Coming soon</span>
    </main>

  </div>
</body>
</html>
