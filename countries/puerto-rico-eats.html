<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eats &mdash; Puerto Rico &mdash; Field Notes</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hanging.css">
  <link rel="stylesheet" href="eats-list.css">

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    /* The browser's own focus ring (a blue rounded box in Chrome) is never
       wanted on this site -- the UI draws its own indicators where it needs
       one, e.g. .country-tab:focus-visible below. */
    :focus{ outline:none; }
    :focus-visible{ outline:none; }
    ::-moz-focus-inner{ border:0; }
    :root{
      --ink:black;
      --muted: rgba(11,11,11,0.62);
      --hairline: rgba(11,11,11,0.20);
      --paper:white;
      --ground:#6F7745;   /* the EATS panel colour */
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --gutter: 34px;
    }
    html{
      overflow-x:hidden;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    html::-webkit-scrollbar{ display:none; }
    /* the STAYS panel colour this page is entered from */
    html, body{ background:var(--ground); }
    body{
      font-family:var(--sans);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
      min-height:100vh;
    }
    a{ color:inherit; text-decoration:none; }

    .page-head{
      position:fixed;
      top:0; left:0; right:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px var(--gutter);
      color:#8c8c8c;
      mix-blend-mode:difference;
      pointer-events:none;
    }
    .page-head a{ pointer-events:auto; }

    /* over a scrolling list, difference-blending against moving text is
       unreadable -- go solid so content passes cleanly underneath */
    .page-head.is-solid{
      mix-blend-mode:normal;
      background:var(--ground);
      color:var(--muted);
    }
    .back{
      display:inline-flex;
      align-items:center;
      color:inherit;
      padding:12px;
      transition:color 300ms ease;
    }
    .back svg{ display:block; width:34px; height:21px; }
    .back:hover{ color:#ffffff; }
    .page-label{
      user-select:none;
      -webkit-user-select:none;
      padding:12px;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }

    /* the word arrives here from the panel. Thin, centred in the page --
       stack.js animates the flying clone to exactly this weight and place. */
    .key-screen{ height:100vh; }

    .section-title{
      pointer-events:none;   /* fixed and centred; must never catch a click */
      position:fixed;
      /* high enough that the hanging key does not cover it */
      top:22%;
      left:0;
      width:100%;
      transform:translateY(-50%);
      text-align:center;
      font-weight:800;
      font-size:clamp(40px, 9vw, 180px);
      line-height:0.85;
      letter-spacing:-0.05em;
      text-transform:uppercase;
      user-select:none;
      -webkit-user-select:none;
    }


    @media (max-width: 640px){
      .page-head{ padding:8px 12px; }
      .page-label{ font-size:10px; }
    }
  </style>
</head>

<body>

  <header class="page-head">
    <a class="back" href="puerto-rico.html" aria-label="Back to Puerto Rico">
      <svg viewBox="0 0 34 21" aria-hidden="true">
        <path d="M34 10.5H3M12.5 2L3 10.5l9.5 8.5" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
    </a>
    <span class="page-label">Puerto Rico</span>
  </header>

  <div class="key-screen"></div>
  <h1 class="section-title">Eats</h1>

  <div class="hanging" style="--obj-w:94; --obj-h:380">
    <svg class="hanging-rope" aria-hidden="true">
      <path d="" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="hanging-card">
      <img src="../images/fork.svg" alt="" draggable="false">
    </div>
  </div>


  <section class="eats" id="eats" data-pull-target>
    <ul class="eats-list">
        <li>
          <a class="eat" href="https://www.google.com/maps/place/Manzana+de+Java/@18.4511105,-66.0582275,17z" target="_blank" rel="noopener noreferrer">
            <span class="eat-head">
              <span class="eat-index">001</span>
              <span class="eat-name">Manzana de Java</span>
              <span class="eat-meta"><span class="town">Santurce</span><span>Machuchal</span><span>Google Maps</span></span>
            </span>
            <span class="eat-body">
              <span class="eat-dish"><em>Order &mdash;</em> PLACEHOLDER — the dish worth ordering</span>
              <span class="eat-blurb">PLACEHOLDER — the vibe of the place, what it serves, why you&#x27;d go.</span>
            </span>
            <span class="eat-photo"><span><img src="../images/eats-pr/manzana-de-java.jpg" alt="Manzana de Java" width="1280" height="966" loading="lazy" decoding="async"></span></span>
          </a>
        </li>
    </ul>
  </section>

  <script src="hanging.js"></script>
</body>
</html>
