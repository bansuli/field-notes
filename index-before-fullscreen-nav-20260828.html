<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Notes</title>
  <!-- Declared explicitly so the browser cannot fall back to whatever
       favicon it has cached for the localhost origin. -->
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="preload" href="images/DSC_3332.jpg" as="image">

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    :root{
      --gs: 1;
      --ink:black;
      --muted: rgba(11,11,11,0.62);
      --faded: rgba(11,11,11,0.20);
      --panel: rgba(11,11,11,0.055);
      --hairline: rgba(11,11,11,0.14);
      --paper:white;
      --sans:"Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --max: 1560px;
      --gutter: 34px;
    }

    /* overflow-x on <body> would make the body its own scroll container,
       which freezes window.scrollY and kills the hero colour fade.
       Keep the horizontal clip on <html> only. */
    html{ overflow-x:hidden; }
    html, body{ background:var(--paper); }
    body{
      font-family:var(--sans);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    /* ===== HERO ===== */
    header{
      padding: 20px 0 0;
      text-align: center;
    }
    .inner{ max-width:var(--max); margin:0 auto; padding:0 var(--gutter); }

    .hero-title{
      text-indent: -0.05em;
      font-weight:800;
      font-size:14vw;
      line-height:0.7;
      letter-spacing:-0.05em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    p{
      margin:22px auto 12px;
      max-width:760px;
      font-size:16px;
      line-height:1.35;
      opacity: 1;
      color: black;
    }

    .bleed{
      width:100vw;
      margin-left:calc(50% - 50vw);
    }
    .hero-image{
      width:100%;
      height:calc(100vh - 180px);
      background-image:url("images/DSC_3332.jpg");
      background-size:cover;
      background-position:center;
      filter: brightness(0.9) grayscale(var(--gs));
      will-change: filter;
    }

    /* ===== COUNTRY TYPE =====
       The type treatment from the old country list, kept for reuse.
       Family is inherited from body (Inter, var(--sans)). */
    .country-type{
      font-weight:300;
      font-size:clamp(26px, 2.8vw, 44px);
      letter-spacing:0.04em;
      text-transform:uppercase;
      color:var(--ink);
    }

    /* ===== COUNTRY PICKER =====
       min-height also gives the hero its scroll runway. */
    .canvas{
      min-height:100vh;
      padding:40px 0 90px;
    }

    /* dropdown, right hand side.
       Custom rather than a native <select>: the OS draws a native option
       list and no CSS can reach it, so it never matches the page. */
    .country-select-wrap{
      display:flex;
      justify-content:flex-end;
    }
    .country-dd{ position:relative; }

    .country-dd-trigger{
      display:flex;
      align-items:center;
      gap:12px;
      font-family:inherit;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--ink);
      background:transparent;
      border:0;
      border-bottom:1px solid var(--hairline);
      border-radius:0;
      padding:8px 2px;
      cursor:pointer;
      transition:border-color 300ms ease;
    }
    .country-dd-trigger:hover,
    .country-dd-trigger:focus-visible{ border-bottom-color:var(--ink); }
    .country-dd-trigger:focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }

    .country-dd-caret{
      width:9px;
      height:9px;
      flex:none;
      transition:transform 260ms ease;
    }
    .country-dd.is-open .country-dd-caret{ transform:rotate(180deg); }

    .country-dd-menu{
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      min-width:100%;
      list-style:none;
      margin:0;
      padding:0;
      /* paper keeps the options legible where they fall over the photo,
         but there is no border, shadow or panel */
      background:var(--paper);
      text-align:right;
      z-index:20;
      /* hidden by default, no layout jump */
      opacity:0;
      visibility:hidden;
      transform:translateY(-4px);
      transition:opacity 200ms ease, transform 200ms ease, visibility 200ms;
    }
    .country-dd.is-open .country-dd-menu{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }

    .country-dd-option{
      white-space:nowrap;
      font-size:12px;
      font-weight:500;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--muted);
      padding:9px 2px;
      cursor:pointer;
      transition:color 200ms ease;
    }
    .country-dd-option:hover,
    .country-dd-option.is-focused{ color:var(--ink); }
    .country-dd-option[aria-selected="true"]{ color:var(--ink); }

    /* ===== COUNTRY TABS =====
       Hover-switched tabs on the left, photo on the right. */
    .country-tabs{
      display:grid;
      grid-template-columns:minmax(240px, 0.85fr) minmax(0, 2fr);
      gap:30px;
      align-items:start;
      max-width:1180px;
      margin:70px auto 0;   /* centred under the hero */
    }

    .country-tab{
      display:block;
      width:100%;
      text-align:left;
      font-family:inherit;
      background:transparent;
      border:0;
      padding:20px 24px;
      cursor:pointer;
      color:var(--faded);
      transition:background-color 420ms ease, color 420ms ease;
    }
    .country-tab.is-active{
      background:var(--panel);
      color:var(--ink);
    }
    .country-tab:hover{ color:var(--muted); }
    .country-tab.is-active:hover{ color:var(--ink); }
    .country-tab:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

    .country-tab-title{
      display:block;
      font-weight:300;
      font-size:clamp(22px, 2.1vw, 34px);
      letter-spacing:0.04em;
      text-transform:uppercase;
      line-height:1.05;
    }

    .country-tabs-media{
      position:relative;
      aspect-ratio:3 / 2;   /* matches both source photos, so no crop */
      overflow:hidden;
      background:var(--panel);
    }
    .country-photo{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity 600ms ease;
    }
    .country-photo.is-active{ opacity:1; }

    @media (prefers-reduced-motion: reduce){
      #app{ transition: none !important; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px){
      .hero-title{
        font-size: 14.5vw;
      }
      p{
        font-size: 10px;
        margin: 12px auto 10px;
      }
      .hero-image{ height: 56vh; }
      .canvas{ padding:28px 0 60px; }
      .country-tabs{
        grid-template-columns:1fr;
        gap:22px;
        margin-top:44px;
      }
      .country-tabs-media{ order:-1; }
      .country-tab{ padding:16px 18px; }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="inner">
        <h1 class="hero-title">FIELD NOTES</h1>
        <p>a curated archive of stays, eats, and experiences. ongoing...</p>
      </div>
      <div class="bleed">
        <div class="hero-image"></div>
      </div>
    </header>

    <section class="canvas">
      <div class="inner">

        <div class="country-select-wrap">
          <div class="country-dd" id="countryDd">
            <button type="button" class="country-dd-trigger" id="countryDdTrigger"
                    aria-haspopup="listbox" aria-expanded="false" aria-label="Country">
              <span id="countryDdValue">Costa Rica</span>
              <svg class="country-dd-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2"/>
              </svg>
            </button>
            <ul class="country-dd-menu" id="countryDdMenu" role="listbox" aria-label="Country">
              <li class="country-dd-option" role="option" data-country="costa-rica" aria-selected="true">Costa Rica</li>
              <li class="country-dd-option" role="option" data-country="puerto-rico" aria-selected="false">Puerto Rico</li>
            </ul>
          </div>
        </div>

        <div class="country-tabs">

          <div class="country-tabs-list" role="tablist" aria-label="Countries">
            <button type="button" role="tab" class="country-tab" data-country="costa-rica" aria-selected="false">
              <span class="country-tab-title">Costa Rica</span>
            </button>
            <button type="button" role="tab" class="country-tab" data-country="puerto-rico" aria-selected="false">
              <span class="country-tab-title">Puerto Rico</span>
            </button>
          </div>

          <div class="country-tabs-media">
            <img class="country-photo" data-country="costa-rica" src="images/entrance/costaricaimage.JPG" alt="Costa Rica" width="2304" height="1536" fetchpriority="high" decoding="async">
            <img class="country-photo" data-country="puerto-rico" src="images/PUERTO.JPG" alt="Puerto Rico" width="2304" height="1536" decoding="async">
          </div>

        </div>

      </div>
    </section>

  </div><!-- end #app -->

  <script>
    if (history.scrollRestoration) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }

    const heroEl = document.querySelector('.hero-image');

    function updateHeroColor(){
      if (!heroEl) return;
      /* fade across most of the hero's own height so the colour arrives
         gradually as the image scrolls away, not in one wheel notch */
      const fadeDistance = Math.max(heroEl.offsetHeight * 0.75, 200);
      const progress = clamp(window.scrollY / fadeDistance, 0, 1);
      const gs = (1 - progress).toFixed(3);
      document.documentElement.style.setProperty('--gs', gs);
      /* set it on the element too: Safari does not always repaint a
         filter() that reads a custom property */
      heroEl.style.filter = 'brightness(0.9) grayscale(' + gs + ')';
    }

    updateHeroColor();
    window.addEventListener('scroll', () => requestAnimationFrame(updateHeroColor), { passive: true });
    window.addEventListener('resize', updateHeroColor);
    window.addEventListener('load', updateHeroColor);
  </script>

  <script>
    (() => {
      const tabs    = [...document.querySelectorAll('.country-tab')];
      const photos  = [...document.querySelectorAll('.country-photo')];
      const dd      = document.getElementById('countryDd');
      const trigger = document.getElementById('countryDdTrigger');
      const menu    = document.getElementById('countryDdMenu');
      const ddValue = document.getElementById('countryDdValue');
      const options = [...menu.querySelectorAll('.country-dd-option')];

      function setCountry(value){
        tabs.forEach(el => {
          const on = el.dataset.country === value;
          el.classList.toggle('is-active', on);
          el.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        photos.forEach(el => el.classList.toggle('is-active', el.dataset.country === value));
        options.forEach(el => {
          const on = el.dataset.country === value;
          el.setAttribute('aria-selected', on ? 'true' : 'false');
          if (on) ddValue.textContent = el.textContent.trim();
        });
      }

      /* ---- dropdown open/close ---- */
      function openDd(){
        dd.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
        focusOption(Math.max(0, options.findIndex(o => o.getAttribute('aria-selected') === 'true')));
      }
      function closeDd(){
        dd.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        options.forEach(o => o.classList.remove('is-focused'));
      }
      function isOpen(){ return dd.classList.contains('is-open'); }

      let focusIndex = 0;
      function focusOption(i){
        focusIndex = (i + options.length) % options.length;
        options.forEach((o, n) => o.classList.toggle('is-focused', n === focusIndex));
      }

      trigger.addEventListener('click', () => isOpen() ? closeDd() : openDd());

      options.forEach(o => {
        o.addEventListener('click', () => { setCountry(o.dataset.country); closeDd(); trigger.focus(); });
        o.addEventListener('mouseenter', () => focusOption(options.indexOf(o)));
      });

      /* click away / Escape */
      document.addEventListener('click', e => { if (isOpen() && !dd.contains(e.target)) closeDd(); });
      dd.addEventListener('keydown', e => {
        switch (e.key){
          case 'Escape':    if (isOpen()){ closeDd(); trigger.focus(); } break;
          case 'ArrowDown': e.preventDefault(); isOpen() ? focusOption(focusIndex + 1) : openDd(); break;
          case 'ArrowUp':   e.preventDefault(); isOpen() ? focusOption(focusIndex - 1) : openDd(); break;
          case 'Enter':
          case ' ':
            if (isOpen()){ e.preventDefault(); setCountry(options[focusIndex].dataset.country); closeDd(); trigger.focus(); }
            break;
        }
      });

      /* ---- tabs ---- */
      tabs.forEach(el => {
        const pick = () => setCountry(el.dataset.country);
        el.addEventListener('mouseenter', pick);   /* switch on hover */
        el.addEventListener('focus', pick);        /* keyboard */
        el.addEventListener('click', pick);        /* touch */
      });

      setCountry(tabs[0].dataset.country);
    })();
  </script>

</body>
</html>
